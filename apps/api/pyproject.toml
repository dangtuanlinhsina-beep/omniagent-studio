[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniagent-api"
version = "0.1.0"
description = "OmniAgent Studio — FastAPI backend (browser sandbox: CDP screencast + human takeover)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Pin EXACTLY matches infra/sandbox-browser/Dockerfile (PLAYWRIGHT_VERSION)
    # so the CDP client and the sandbox browser always speak the same protocol.
    "playwright==1.63.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Security layer: JWT verification (HS256 + RS256/ES256 via JWKS) and
    # async JWKS fetching.
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omniagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "BLE", # flake8-blind-except
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "SIM108",  # ternary-vs-if-block is a taste call
    "SIM117",  # nested with blocks are clearer for ws sessions
]

[tool.ruff.lint.per-file-ignores]
# Test scripts favour explicit one-line checks over wrapped expressions.
"tests/*" = ["BLE001", "SLF001", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
